<svg width="500" height="175" viewBox="0 0 500 175" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="500" height="175" rx="12" fill="#0a0a0a"/>

  <!-- Microfilm reader machine -->
  <g transform="translate(25, 18)">
    <!-- Machine base -->
    <rect x="5" y="45" width="75" height="48" rx="2" fill="#505050" stroke="#606060" stroke-width="1.5"/>
    <!-- Screen -->
    <rect x="12" y="51" width="61" height="36" rx="1" fill="#e8e8e0" stroke="#404040" stroke-width="1"/>
    <!-- Newspaper on screen -->
    <rect x="16" y="55" width="26" height="3" rx="0.5" fill="#111" opacity="0.9"/>
    <rect x="16" y="60" width="53" height="1.5" rx="0.5" fill="#333" opacity="0.7"/>
    <rect x="16" y="64" width="53" height="1.5" rx="0.5" fill="#333" opacity="0.7"/>
    <rect x="16" y="68" width="42" height="1.5" rx="0.5" fill="#333" opacity="0.7"/>
    <rect x="16" y="72" width="53" height="1.5" rx="0.5" fill="#333" opacity="0.7"/>
    <rect x="16" y="76" width="36" height="1.5" rx="0.5" fill="#333" opacity="0.7"/>
    <rect x="16" y="80" width="53" height="1.5" rx="0.5" fill="#333" opacity="0.7"/>
    <!-- Film reels -->
    <circle cx="22" cy="100" r="7.5" fill="#505050" stroke="#707070" stroke-width="1.2"/>
    <circle cx="22" cy="100" r="4.5" fill="none" stroke="#606060" stroke-width="0.8"/>
    <circle cx="22" cy="100" r="2.2" fill="#404040"/>
    <circle cx="68" cy="100" r="7.5" fill="#505050" stroke="#707070" stroke-width="1.2"/>
    <circle cx="68" cy="100" r="4.5" fill="none" stroke="#606060" stroke-width="0.8"/>
    <circle cx="68" cy="100" r="2.2" fill="#404040"/>
    <!-- Film path -->
    <path d="M 29.5 100 L 38 100 L 38 93 L 52 93 L 52 100 L 60.5 100" stroke="#606060" stroke-width="1.8" fill="none"/>
    <!-- Screen glow -->
    <rect x="12" y="51" width="61" height="36" rx="1" fill="#707070" opacity="0.08"/>
  </g>

  <!-- Text -->
  <text x="130" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="58" font-weight="800" fill="#d0d0d0" letter-spacing="-1">
    Press<tspan fill="#b0b0b0">Digger</tspan>
  </text>
</svg>
