<svg width="32" height="32" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Thin white border for visibility on dark backgrounds -->
  <rect x="1" y="1" width="98" height="98" rx="17" stroke="white" stroke-width="2.5"/>

  <!-- Screen / newspaper -->
  <rect x="18" y="38" width="64" height="42" rx="4" fill="#e8e6dc"/>

  <!-- Headline bar -->
  <rect x="24" y="44" width="30" height="6" rx="1.5" fill="#222"/>
  <!-- Text lines -->
  <rect x="24" y="54" width="52" height="3.5" rx="1" fill="#555"/>
  <rect x="24" y="60" width="52" height="3.5" rx="1" fill="#555"/>
  <rect x="24" y="66" width="38" height="3.5" rx="1" fill="#555"/>
  <rect x="24" y="72" width="52" height="3.5" rx="1" fill="#555"/>

  <!-- Left film reel -->
  <circle cx="28" cy="26" r="11" fill="#444" stroke="#666" stroke-width="2"/>
  <circle cx="28" cy="26" r="5" fill="none" stroke="#666" stroke-width="1.5"/>
  <circle cx="28" cy="26" r="2.5" fill="#777"/>

  <!-- Right film reel -->
  <circle cx="72" cy="26" r="11" fill="#444" stroke="#666" stroke-width="2"/>
  <circle cx="72" cy="26" r="5" fill="none" stroke="#666" stroke-width="1.5"/>
  <circle cx="72" cy="26" r="2.5" fill="#777"/>

  <!-- Film strip path -->
  <path d="M 38 26 L 44 26 L 44 38 L 56 38 L 56 26 L 62 26" stroke="#666" stroke-width="3" stroke-linecap="round" fill="none"/>
</svg>

