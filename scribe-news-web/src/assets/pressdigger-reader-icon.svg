<!-- PressDigger Icon - Microfilm Reader Machine -->
<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Machine base/body -->
  <rect x="10" y="40" width="80" height="50" rx="2" fill="#505050" stroke="#606060" stroke-width="1.5"/>
  
  <!-- Screen/viewing area -->
  <rect x="18" y="47" width="64" height="38" rx="1" fill="#2a2a2a" stroke="#404040" stroke-width="1"/>
  
  <!-- Newspaper content on screen (glowing) -->
  <rect x="22" y="51" width="28" height="3" rx="0.5" fill="#b0b0b0" opacity="0.9"/>
  <rect x="22" y="57" width="56" height="1.5" rx="0.5" fill="#909090" opacity="0.7"/>
  <rect x="22" y="61" width="56" height="1.5" rx="0.5" fill="#909090" opacity="0.7"/>
  <rect x="22" y="65" width="44" height="1.5" rx="0.5" fill="#909090" opacity="0.7"/>
  <rect x="22" y="69" width="56" height="1.5" rx="0.5" fill="#909090" opacity="0.7"/>
  <rect x="22" y="73" width="38" height="1.5" rx="0.5" fill="#909090" opacity="0.7"/>
  <rect x="22" y="77" width="56" height="1.5" rx="0.5" fill="#909090" opacity="0.7"/>
  
  <!-- Control knobs -->
  <circle cx="95" cy="60" r="4" fill="#404040" stroke="#606060" stroke-width="1"/>
  <circle cx="95" cy="73" r="4" fill="#404040" stroke="#606060" stroke-width="1"/>
  
  <!-- Film reels on top -->
  <circle cx="25" cy="33" r="8" fill="#505050" stroke="#707070" stroke-width="1.2"/>
  <circle cx="25" cy="33" r="5" fill="none" stroke="#606060" stroke-width="0.8"/>
  <circle cx="25" cy="33" r="2.5" fill="#404040"/>
  
  <circle cx="75" cy="33" r="8" fill="#505050" stroke="#707070" stroke-width="1.2"/>
  <circle cx="75" cy="33" r="5" fill="none" stroke="#606060" stroke-width="0.8"/>
  <circle cx="75" cy="33" r="2.5" fill="#404040"/>
  
  <!-- Film threading -->
  <path d="M 33 33 L 42 33 L 42 40 L 58 40 L 58 33 L 67 33" stroke="#606060" stroke-width="2" fill="none"/>
  
  <!-- Screen glow -->
  <rect x="18" y="47" width="64" height="38" rx="1" fill="#707070" opacity="0.1"/>
</svg>
