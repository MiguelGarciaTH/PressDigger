# Spring server
server.port=8085

# Enable compression
server.compression.enabled=true
server.compression.mime-types=image/png,image/jpeg,image/gif

# Increase buffer sizes
server.tomcat.max-http-post-size=10MB

# Postgres
spring.datasource.url=jdbc:postgresql://localhost/scribe-ref-db
spring.datasource.username=postgres
spring.datasource.password=postgres

scribe-ref.arquivo.scribe-rest.embedding-service-url=http://localhost:8000/embed


# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Session cookie settings for cross-origin
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
# Session persistence
server.servlet.session.timeout=24h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.max-age=86400
server.servlet.session.persistent=true