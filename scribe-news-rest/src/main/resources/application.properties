# Spring server
server.port=8085

# Enable compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,application/json,application/javascriptserver.forward-headers-strategy=native

# Increase buffer sizes
server.tomcat.max-http-post-size=10MB

# Postgres
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost/scribe-ref-db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

scribe-ref.images.base-path=${IMAGES_BASE_PATH:../images}


# OpenAI API key
scribe-ref.arquivo.scribe-news-rest.open-ai.api-key=${OPEN_AI_API_KEY}
scribe-ref.arquivo.scribe-news-rest.open-ai.max-usage=${OPEN_AI_MAX_USAGE}
scribe-ref.arquivo.scribe-news-rest.open-ai.max-usage-period=${OPEN_AI_MAX_USAGE_PERIOD}

# Cohere API key (only needed if embedding provider is 'cohere')
scribe-ref.arquivo.scribe-news-rest.cohere.api-key=${COHERE_API_KEY:}

# Embedding provider: 'openai' or 'cohere'
scribe-ref.embedding.provider=${EMBEDDING_PROVIDER:openai}

# Google OAuth2 Configuration
google.client.id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI}
app.frontend-url=${FRONTEND_URL}


# Session cookie settings for cross-origin
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true
# Optional but recommended: share session across www and non-www
server.servlet.session.cookie.domain=press-digger.com

# Session persistence
server.servlet.session.timeout=24h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.max-age=86400
server.servlet.session.persistent=true

# Cap pageable size to prevent abuse (e.g., ?size=999999)
spring.data.web.pageable.max-page-size=100

# Do NOT expose internal error messages to clients
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
