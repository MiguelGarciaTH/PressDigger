# Spring server
server.port=8084

# Postgres
spring.datasource.url=jdbc:postgresql://localhost/scribe-ref-db
spring.datasource.username=postgres
spring.datasource.password=postgres

#Kafka
#Kafka consumer
spring.kafka.consumer.group-id=arquivo-embeddings-processor-1
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=manual
spring.kafka.listener.concurrency=1
spring.kafka.consumer.properties.partition.assignment.strategy=org.apache.kafka.clients.consumer.RoundRobinAssignor

## topic to send
scribe-ref.arquivo.scribe-news-embeddings-processor.kafka.to-listen.topic=arquivo-text-embeddings
# increased concurrency to allow parallel processing (tune based on CPU/network)
scribe-ref.arquivo.scribe-news-embeddings-processor.kafka.to-listen.concurrency=1

# Service properties
scribe-ref.arquivo.scribe-news-embeddings-processor.enable=true


scribe-ref.arquivo.scribe-embeddings-processor.embedding-service-url=http://localhost:8000/embed
