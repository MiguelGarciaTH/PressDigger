# Spring server
server.port=8081

# Postgres
spring.datasource.url=jdbc:postgresql://localhost/scribe-ref-db
spring.datasource.username=postgres
spring.datasource.password=postgres

#Kafka
#Kafka consumer
spring.kafka.consumer.group-id=arquivo-image-processor-1
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=manual
spring.kafka.listener.concurrency=1
spring.kafka.consumer.properties.partition.assignment.strategy=org.apache.kafka.clients.consumer.RoundRobinAssignor
spring.kafka.consumer.max-poll-interval-ms=900000
spring.kafka.consumer.max-poll-records=3
spring.kafka.consumer.session-timeout-ms=45000
spring.kafka.consumer.heartbeat-interval-ms=15000

## topic to send
scribe-ref.arquivo.scribe-news-image-processor.kafka.to-listen.topic=${IMAGE_PROCESSOR_TOPIC}
# increased concurrency to allow parallel processing (tune based on CPU/network)
scribe-ref.arquivo.scribe-news-image-processor.kafka.to-listen.concurrency=${IMAGE_PROCESSOR_CONCURRENCY}

scribe-ref.arquivo.scribe-news-image-processor.kafka.to-send.topic=${TEXT_PROCESSOR_TOPIC}
scribe-ref.arquivo.scribe-news-image-processor.kafka.to-send.concurrency=${TEXT_PROCESSOR_CONCURRENCY}


# Service properties
scribe-ref.arquivo.scribe-news-image-processor.enable=true
scribe-ref.arquivo.scribe-news-image-processor.image-path-directory=images

# Thumbnail / processing tuning
scribe-ref.arquivo.scribe-news-image-processor.thumbnail.quality=0.9

# HTTP timeouts for image fetch (ms)
scribe-ref.arquivo.scribe-news-image-processor.http.connect-timeout-ms=5000
scribe-ref.arquivo.scribe-news-image-processor.http.read-timeout-ms=500000
