# Spring server
server.port=8081

# Postgres
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost/scribe-ref-db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

#Kafka
#Kafka consumer
spring.kafka.consumer.group-id=arquivo-image-processor-1
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=manual
spring.kafka.consumer.properties.partition.assignment.strategy=org.apache.kafka.clients.consumer.RoundRobinAssignor
spring.kafka.consumer.properties.max.poll.interval.ms=900000
spring.kafka.consumer.properties.session.timeout.ms=45000
spring.kafka.consumer.properties.heartbeat.interval.ms=15000
spring.kafka.consumer.properties.max.poll.records=1

## topic to send
scribe-ref.arquivo.scribe-news-image-processor.kafka.to-listen.topic=${IMAGE_PROCESSOR_TOPIC}
# increased concurrency to allow parallel processing (tune based on CPU/network)
scribe-ref.arquivo.scribe-news-image-processor.kafka.to-listen.concurrency=${IMAGE_PROCESSOR_CONCURRENCY}

scribe-ref.arquivo.scribe-news-image-processor.kafka.to-send.topic=${TEXT_PROCESSOR_TOPIC}
scribe-ref.arquivo.scribe-news-image-processor.kafka.to-send.concurrency=${TEXT_PROCESSOR_CONCURRENCY}

scribe-ref.arquivo.scribe-news-image-processor.ocr-service-url=http://localhost:8001
scribe-ref.arquivo.scribe-image-backfill.enable=false
scribe-ref.arquivo.scribe-image-processor.enable=true

# Service properties
scribe-ref.arquivo.scribe-news-image-processor.enable=true
scribe-ref.arquivo.scribe-news-image-processor.image-path-directory=images

# Thumbnail / processing tuning
scribe-ref.arquivo.scribe-news-image-processor.thumbnail.quality=0.9

# HTTP timeouts for image fetch (ms)
scribe-ref.arquivo.scribe-news-image-processor.http.read-timeout-ms=600000
scribe-ref.arquivo.scribe-news-image-processor.http.connect-timeout-ms=30000

# Retry configuration
scribe-ref.arquivo.scribe-news-image-processor.http.max-retries=5
scribe-ref.arquivo.scribe-news-image-processor.http.initial-backoff-ms=2000
scribe-ref.arquivo.scribe-news-image-processor.http.backoff-multiplier=2.0
